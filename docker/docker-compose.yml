services:
  mariadb:
    image: mariadb:latest
    container_name: mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: tcc
      MARIADB_USER: tccuser
      MARIADB_PASSWORD: tccpassword
      MARIADB_CHARACTER_SET: utf8mb4
      MARIADB_COLLATE: utf8mb4_unicode_ci
      TZ: America/Sao_Paulo
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./daelt-schema.sql:/docker-entrypoint-initdb.d/daelt-schema.sql
      - ./tcc-schema.sql:/docker-entrypoint-initdb.d/tcc-schema.sql
  phpmyadmin:
    image: linuxserver/phpmyadmin:latest
    container_name: phpmyadmin
    restart: always
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpassword
      TZ: America/Sao_Paulo
    ports:
      - "8080:80"
    depends_on:
      - mariadb
volumes:
  mariadb_data:
